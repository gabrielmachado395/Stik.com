<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stik Elásticos</title>
    <link rel="stylesheet" href="stylesheet/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>

<body class="index-page">
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <main class="main-page">
        <section class="video-hero-section">
            <div class="video-container" data-hero-mode="slideshow" data-poster="img/optimized/hero-banner-01.jpg" data-slideshow-duration="6200" data-slideshow-images='[{"image":"img/optimized/hero-banner-01.jpg","alt":"Banner institucional STIK 01"},{"image":"img/optimized/hero-banner-02.jpg","alt":"Banner institucional STIK 02"},{"image":"img/optimized/hero-banner-03.jpg","alt":"Banner institucional STIK 03"}]'>
                <div id="institutionalHeroSlideshow" class="hero-slideshow hero-media-element" data-active-index="0">
                    <img class="is-active" src="img/optimized/hero-banner-01.jpg" alt="Banner institucional STIK 01" loading="eager" decoding="async">
                    <img src="img/optimized/hero-banner-02.jpg" alt="Banner institucional STIK 02" loading="lazy" decoding="async">
                    <img src="img/optimized/hero-banner-03.jpg" alt="Banner institucional STIK 03" loading="lazy" decoding="async">
                </div>
            </div>
            <div id="header-hover-area"></div>
        </section>
        <div id="overlay"></div>

        <section class="product-highlights animate-on-scroll">
            <h2>PRODUTOS</h2>
            <div class="highlights-grid">
                <div class="highlight-item small-top-left">
                    <img src="img/Imagens novas/MODA INTIMA.png" alt="MODA ÍNTIMA" width="1023" height="1537" loading="lazy" decoding="async">
                    <span>MODA ÍNTIMA</span>
                </div>
                <div class="highlight-item large-center">
                    <img src="img/Imagens novas/UNIVERSO MASCULINO.png" alt="UNIVERSO MASCULINO" width="1024" height="1536" loading="lazy" decoding="async">
                    <span>UNIVERSO MASCULINO</span>
                </div>
                <div class="highlight-item small-top-right">
                    <img src="img/Imagens novas/MODA ESPORTIVA.png" alt="MODA ESPORTIVA" width="1228" height="1100" loading="lazy" decoding="async">
                    <span>MODA ESPORTIVA</span>
                </div>
                <div class="highlight-item small-bottom-left">
                    <img src="img/Imagens novas/MODA PRAIA.png" alt="MODA PRAIA" width="1086" height="1448" loading="lazy" decoding="async">
                    <span>MODA PRAIA</span>
                </div>
                <div class="highlight-item small-bottom-right">
                    <img src="img/Imagens novas/MODA INFANTIL.png" alt="MODA INFANTIL" width="1024" height="1536" loading="lazy" decoding="async">
                    <span>MODA INFANTIL</span>
                </div>
            </div>
        </section>

        <section class="catalogo-section animate-on-scroll">
            <h2>CATÁLOGO</h2>
            <p class="catalogo-subtitle">Explore nossas linhas, acabamentos e soluções pensadas para diferentes necessidades de criação e produção.</p>
            <div class="catalogo-wrapper">
                <div id="lista-produtos" class="catalogo-grid">
                </div>
            </div>
        </section>
    </main>
    <div id="catalogo-placeholder"></div>

    <div id="footer-placeholder"></div>

    <script src="stylesheet/script.js"></script>
</body>
</html>
