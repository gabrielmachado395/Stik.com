<header class="top-header" id="mainHeader">
    
    <div class="header-left">
        <button class="menu-toggle" aria-label="Abrir Menu">
            <i class="fas fa-bars"></i>
        </button>
        <div class="header-logo">
            <a href="index.html">
                <img src="img/optimized/logo-header.png" alt="Logo STIK" width="512" height="512" decoding="async" fetchpriority="high">
            </a>
        </div>
    </div>
    <div class="header-right">        
        <label class="language-switcher" for="languageSelect">
            <span class="sr-only">Idioma</span>
            <select id="languageSelect" class="language-select" aria-label="Idioma">
                <option value="pt">PT</option>
                <option value="en">EN</option>
                <option value="es">ES</option>
                <option value="fr">FR</option>
            </select>
        </label>
        <button class="icon-btn theme-toggle" type="button" aria-label="Alternar tema" title="Alternar tema">
            <i class="fas fa-moon" aria-hidden="true"></i>
        </button>
        <div class="search-container">
            <button class="icon-btn search-toggle" aria-label="Pesquisar">
                <i class="fas fa-search"></i>
            </button>
            
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar produtos...">
                <div id="searchResultsList" class="search-results-dropdown"></div>
            </div>
        </div>
        
    </div>
</header>
